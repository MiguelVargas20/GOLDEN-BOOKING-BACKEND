spring.application.name=goldenbooking

# MongoDB - prefijo correcto
spring.mongodb.uri=mongodb://localhost:27017/goldenbooking
spring.mongodb.database=goldenbooking

# Puerto
server.port=8080

# Logs
logging.level.org.springframework=INFO
spring.data.mongodb.auto-index-creation=true
logging.level.org.springframework.data.mongodb=INFO

# Mínimo 32 caracteres para HS256# ✅ Lee desde variable de entorno — nunca expone el valor real
miclavesecreta=${JWT_SECRET}

# Refresh token: días de validez antes de requerir login con contraseña de nuevo
jwt.refresh.expiracion-dias=${JWT_REFRESH_DIAS:7}

# ── Swagger / OpenAPI ────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.persistAuthorization=true

# Configuración de correo electrónico para notificaciones
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Correo que recibe las notificaciones de nuevos mensajes de contacto.
# Por defecto usa la misma cuenta configurada para enviar correos (MAIL_USERNAME),
# pero puede sobreescribirse con la variable de entorno ADMIN_NOTIFICACIONES_EMAIL
# si quieres que las notificaciones lleguen a un correo distinto.
app.admin.correo-notificaciones=${ADMIN_NOTIFICACIONES_EMAIL:${MAIL_USERNAME}}

# ── CORS ──────────────────────────────────────────────────────
# Orígenes permitidos para consumir la API (separados por coma).
# En desarrollo apunta al frontend Vite; en producción se sobreescribe
# con la variable de entorno CORS_ALLOWED_ORIGINS (ej: https://tu-dominio.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:56155}

# ── Reservas deportivas ─────────────────────────────────────────
# Tarifa por hora para reservas de espacios deportivos (antes hardcodeada en el código)
app.reservas.deporte.tarifa-hora=${DEPORTE_TARIFA_HORA:50000.0}

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}